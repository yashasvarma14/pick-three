name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests fake the embedding model, so fastembed isn't needed here.
      - run: pip install pandas numpy requests beautifulsoup4 anthropic fastapi httpx pytest
      - run: python -m pytest -q
